name: Bug Bounty Scope Monitor

on:
  schedule:
    - cron: '0 */6 * * *' # يفحص المستودع الأصلي تلقائياً كل 6 ساعات
  workflow_dispatch: # يتيح لك تشغيله يدوياً في أي وقت

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch latest commit from upstream repository
        run: |
          # جلب أحدث Commit من المستودع الأصلي مباشرة
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/arkadiyt/bounty-targets-data/commits/main")
          COMMIT_MSG=$(echo "$LATEST_COMMIT" | jq -r '.commit.message')
          COMMIT_URL=$(echo "$LATEST_COMMIT" | jq -r '.html_url')
          COMMIT_DATE=$(echo "$LATEST_COMMIT" | jq -r '.commit.committer.date')
          
          # حساب الفرق الزمني بالثواني
          COMMIT_TIMESTAMP=$(date -d "$COMMIT_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DIFF=$((CURRENT_TIMESTAMP - COMMIT_TIMESTAMP))

          # الإرسال فقط إذا كان التحديث في المستودع الأصلي حدث خلال آخر 6 ساعات (22500 ثانية)
          if [ $DIFF -lt 22500 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MESSAGE="🚨 تحديث جديد في الـ Scope على المستودع الأصلي!

📝 العملية: ${COMMIT_MSG}
🔗 التفاصيل: ${COMMIT_URL}"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "لا يوجد تحديثات جديدة في المستودع الأصلي خلال الـ 6 ساعات الماضية."
          fi
