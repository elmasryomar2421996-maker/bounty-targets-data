name: Bug Bounty Scope Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and check upstream commit
        run: |
          # 1. جلب البيانات الأساسية بـ curl و jq
          RESPONSE=$(curl -s "https://api.github.com/repos/arkadiyt/bounty-targets-data/commits/main")
          
          COMMIT_MSG=$(echo "$RESPONSE" | jq -r '.commit.message' | head -n 1)
          COMMIT_URL=$(echo "$RESPONSE" | jq -r '.html_url')
          COMMIT_DATE=$(echo "$RESPONSE" | jq -r '.commit.committer.date')

          # 2. تحويل تاريخ GitHub لـ Unix Timestamp عبر Python
          COMMIT_TIMESTAMP=$(python3 -c "import dateutil.parser as p; print(int(p.parse('$COMMIT_DATE').timestamp()))")
          CURRENT_TIMESTAMP=$(python3 -c "import time; print(int(time.time()))")
          
          DIFF=$((CURRENT_TIMESTAMP - COMMIT_TIMESTAMP))
          echo "Diff in seconds: $DIFF"

          # 3. الشرط وإرسال الرسالة عبر curl مباشرة
          if [ $DIFF -lt 22500 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MESSAGE="🚨 تحديث جديد في الـ Scope!

📝 العملية: ${COMMIT_MSG}
🔗 التفاصيل: ${COMMIT_URL}"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "لا يوجد تحديثات جديدة خلال الـ 6 ساعات الماضية."
          fi
