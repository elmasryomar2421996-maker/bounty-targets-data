name: Bug Bounty Scope Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and check upstream commit
        run: |
          # جلب بيانات أحدث Commit والوقت الخاص به بالتوقيت الموحد Unix Timestamp
          COMMIT_DATA=$(curl -s "https://api.github.com/repos/arkadiyt/bounty-targets-data/commits/main")
          COMMIT_MSG=$(echo "$COMMIT_DATA" | jq -r '.commit.message')
          COMMIT_URL=$(echo "$COMMIT_DATA" | jq -r '.html_url')
          COMMIT_DATE=$(echo "$COMMIT_DATA" | jq -r '.commit.committer.date')
          
          COMMIT_TIMESTAMP=$(date --date="$COMMIT_DATE" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DIFF=$((CURRENT_TIMESTAMP - COMMIT_TIMESTAMP))

          # الإرسال إذا كان التحديث خلال آخر 6 ساعات (22500 ثانية) أو تشغيل يدوي
          if [ $DIFF -lt 22500 ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MESSAGE="🚨 تحديث جديد في الـ Scope على المستودع الأصلي!

📝 العملية: ${COMMIT_MSG}
🔗 التفاصيل: ${COMMIT_URL}"

            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "لا يوجد تحديثات جديدة خلال الـ 6 ساعات الماضية."
          fi
