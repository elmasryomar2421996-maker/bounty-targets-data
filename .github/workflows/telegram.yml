name: Bug Bounty Scope Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # يتم فحص التغييرات تلقائياً كل 6 ساعات
  workflow_dispatch:

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: git-check
        run: |
          if git log -1 --pretty=format:"%s" | grep -q "Auto-update"; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT # لتجربة الإرسال، يمكنك جعلها true دائماً أو ربطها بالتغييرات الفعليّة
          fi

      - name: Send Telegram Notification
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          
          MESSAGE="🚨 *تنبيه تحديث في الـ Scope!*\n\n📝 *العملية:* ${COMMIT_MSG}\n🔗 *التفاصيل:* [عرض التغييرات](${COMMIT_URL})"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"
